name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege default for the auto-injected GITHUB_TOKEN. The publish jobs
# push to external registries via their own secrets, not the GITHUB_TOKEN, so
# they need no repo write. The jobs that genuinely write through the
# GITHUB_TOKEN (github-release, node-/wasm-publish provenance, attestations)
# declare those rights in their own job-level permissions blocks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io / npm inside any build or publish step
  # retries automatically instead of failing the job.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  PIP_RETRIES: "5"
  PIP_DEFAULT_TIMEOUT: "120"

jobs:
  # --------------------------------------------------------------------------
  # Nothing irreversible happens after a build that failed.
  #
  # The `guard` job below checks the ref before anything is built. This one is
  # the barrier between building and publishing: without it every publish job
  # depends only on its own artefacts, so a crate that fails to build stops
  # crates.io and lets PyPI, npm, NuGet, Maven Central and the Go mirror go
  # ahead -- a half-published version that no registry takes back.
  # --------------------------------------------------------------------------
  gate:
    name: Nothing publishes before this
    needs: [python-wheels, python-sdist, node-build, cli-binaries, c-abi-build, wasm-build]
    runs-on: ubuntu-latest
    # Generous because this job waits for ci.yml to settle on the tagged commit;
    # the wait itself is bounded to 45 minutes inside the step.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: The tagged commit must have passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # ci.yml runs on pushes to main and on pull requests, never on a tag,
          # so this workflow cannot see the tag's health in its own run. Ask what
          # the commit itself was graded, which is the merge commit the tag
          # points at and therefore the state that was actually tested.
          #
          # A run that is still going carries conclusion `null`, which reads the
          # same as one that failed -- and a tag pushed straight after its merge
          # lands while ci.yml is still queued. Refusing there turns "tagged a
          # minute early" into a failed release that needs a rerun, so wait for
          # the verdict instead of treating its absence as one. A red conclusion
          # still ends this immediately: only the undecided case waits.
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            ci_state=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
                 -q '(.workflow_runs[0] // {}) | "\(.status // "missing") \(.conclusion // "null")"')
            ci_status=${ci_state%% *}
            ci=${ci_state##* }
            if [ "$ci" = "success" ]; then
              break
            fi
            if [ "$ci" != "null" ]; then
              echo "::error::ci.yml on ${SHA} is ${ci}; refusing to publish"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::ci.yml on ${SHA} did not finish within 45 minutes (${ci_status}); refusing to publish"
              exit 1
            fi
            echo "ci.yml on ${SHA}: ${ci_status} -- waiting"
            sleep 30
          done
          echo "ci.yml on ${SHA}: success"

          # And nothing else that did run may have failed. Listing required
          # workflows by name would go stale -- a path-filtered one legitimately
          # does not run for a version bump -- so the rule is about outcomes
          # rather than about a roster: whatever ran, none of it is red.
          #
          # Only the newest run of each workflow counts. ci.yml carries
          # `concurrency: cancel-in-progress`, so a commit that receives two
          # push events has its first run cancelled by its second; without the
          # grouping any commit that ran CI twice is unreleasable however green
          # the surviving run was (wickra-strategy-ci lost a release to exactly
          # that: 51 superseded checks, zero real failures). Within the newest
          # run, cancelled is red: a cancelled CI is not a green CI.
          bad=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
                  -q '[.workflow_runs[] | select(.name != "Release")]
                      | group_by(.name) | map(max_by(.id))
                      | map(select(.conclusion == "failure" or .conclusion == "timed_out"
                                   or .conclusion == "cancelled"))
                      | map(.name) | unique | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::the tagged commit has failing runs (${bad}); refusing to publish"
            exit 1
          fi
          echo "every workflow that ran on this commit is green"

  # Everything that publishes runs behind this. A `workflow_dispatch` can be
  # started from any ref the actor can see, and every job here pushes to a
  # registry that does not take things back -- so a dispatch from `main` would
  # publish whatever `main` happened to be, under whatever version its manifests
  # happened to carry. Tag pushes satisfy this by construction; a dispatch has to
  # name a tag.
  guard:
    name: Refuse to publish from anything but a tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the ref
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          case "$REF" in
            refs/tags/v*)
              echo "publishing from $REF"
              ;;
            *)
              echo "::error::release.yml publishes to crates.io, PyPI, npm, NuGet and Maven Central, none of which can be undone. It runs on a v* tag; got '$REF'. Re-run this workflow with a tag ref."
              exit 1
              ;;
          esac

  # --------------------------------------------------------------------------
  # crates.io: wickra-copilot-core, then wickra-copilot-llm, then the wickra-copilot crate (wickra-copilot binary)
  # --------------------------------------------------------------------------
  cargo-publish:
    name: Publish to crates.io
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [gate, guard]
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Idempotent publishing: if the version is already on crates.io we treat
      # that as success so re-runs of the workflow do not fail.
      - name: Publish wickra-copilot-core (idempotent)
        run: |
          if out=$(cargo publish -p wickra-copilot-core --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif printf '%s' "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index to refresh
        run: sleep 45

      # The CLI depends on the swappable LLM adapter, so it must be on crates.io
      # before the CLI can publish.
      - name: Publish wickra-copilot-llm (idempotent)
        run: |
          if out=$(cargo publish -p wickra-copilot-llm --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif printf '%s' "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index to refresh
        run: sleep 45

      - name: Publish wickra-copilot (idempotent)
        run: |
          if out=$(cargo publish -p wickra-copilot --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif printf '%s' "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Produce .crate files for the GitHub Release attachments.
      - name: Build .crate files for release attachment
        run: |
          cargo package -p wickra-copilot-core
          cargo package -p wickra-copilot-llm
          cargo package -p wickra-copilot

      - name: Upload .crate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-files
          path: target/package/*.crate

      # CycloneDX SBOM per published crate.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOMs
        run: |
          cargo cyclonedx --format json --top-level
          mkdir -p sboms
          cp crates/copilot-core/wickra-copilot-core.cdx.json sboms/
          cp crates/copilot-llm/wickra-copilot-llm.cdx.json sboms/
          cp crates/copilot-cli/wickra-copilot.cdx.json sboms/
          ls -lh sboms/

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/*.cdx.json

  # --------------------------------------------------------------------------
  # PyPI: cross-platform wheels + sdist
  # --------------------------------------------------------------------------
  python-wheels:
    name: Build wheels (${{ matrix.target }}/${{ matrix.manylinux }} on ${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Sync root README into bindings/python so it ships with the wheel
        shell: bash
        run: cp README.md bindings/python/README.md
      # The Python binding depends only on wickra-copilot-core (pure canonicalization +
      # hashing, no native networking), so the manylinux/musllinux containers
      # build the wheel with no extra system dependencies.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --strip --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*

  python-sdist:
    name: Build Python sdist
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync root README into bindings/python so it ships in the sdist
        run: cp README.md bindings/python/README.md
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: bindings/python/dist/*

  python-publish:
    name: Publish to PyPI
    timeout-minutes: 45
    needs: [gate, python-wheels, python-sdist]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Upload to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          args: --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # --------------------------------------------------------------------------
  # npm: per-platform native binaries + main meta-package
  # --------------------------------------------------------------------------
  node-build:
    name: Node build (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # npm install (not ci): the per-platform optionalDependencies are not yet
      # published, so they are absent from the lock and npm ci would reject it.
      - name: Install Node deps
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Build native module
        working-directory: bindings/node
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/wickra-copilot.*.node
          if-no-files-found: error

  node-publish:
    name: Publish to npm
    timeout-minutes: 45
    needs: [gate, node-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore provenance from the GitHub OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install Node deps
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Download all platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/node/artifacts
          pattern: bindings-*
      # The npm/<platform>/package.json templates are committed (bindings/node/npm/),
      # so `napi artifacts` only drops the freshly built .node binary into the
      # matching directory. napi-rs CLI 3 renamed `--dir` to `--output-dir`.
      - name: Move binaries into platform package layout
        working-directory: bindings/node
        run: npx napi artifacts --output-dir artifacts

      # Every package here declares "MIT OR Apache-2.0" and only package.json is
      # committed in npm/<platform>/, so without this the texts the licence
      # names are absent from the published tarball. `files` lists them; this
      # puts them there, and the check below refuses to publish if npm would
      # still leave one out.
      - name: Carry the licence texts into every package
        working-directory: bindings/node
        shell: bash
        run: |
          set -euo pipefail
          for dir in . npm/*/; do
            cp ../../LICENSE-MIT ../../LICENSE-APACHE "$dir/"
          done
          # The ${...} below are JavaScript template literals inside node -e,
          # not shell expansions -- single quotes are what keeps the shell out
          # of them. The reason goes on its own line: shellcheck reads anything
          # after the directive as further directives and reports SC1072 on it.
          # shellcheck disable=SC2016
          for dir in . npm/*/; do
            ( cd "$dir" && npm pack --dry-run --json ) | node -e '
              const chunks = [];
              process.stdin.on("data", c => chunks.push(c));
              process.stdin.on("end", () => {
                const pkg = JSON.parse(chunks.join(""))[0];
                const names = pkg.files.map(f => f.path);
                const missing = ["LICENSE-MIT", "LICENSE-APACHE"].filter(n => !names.includes(n));
                if (missing.length) {
                  console.error(`::error::${pkg.name} would publish without ${missing.join(" and ")}`);
                  process.exit(1);
                }
                console.log(`${pkg.name}: licence texts present`);
              });
            '
          done

      - name: Publish platform packages (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          fail=0
          publish_dir() {
            local dir=$1
            local pkg
            pkg=$(basename "$dir")
            local pkgname="wickra-copilot-$pkg"
            local existing
            existing=$(npm view "$pkgname@$version" version 2>/dev/null)
            if [ "$existing" = "$version" ]; then
              echo "::notice::skip $pkgname@$version (already on npm)"
              return 0
            fi
            echo "::group::publish $pkgname@$version"
            (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
            local rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::first attempt of $pkgname failed (rc=$rc); retrying after 30s"
              sleep 30
              (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
              rc=$?
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::$pkgname could not be published — the release would land with a missing platform binary; failing the job."
              return 1
            fi
            return 0
          }
          for dir in npm/*/; do
            publish_dir "$dir" || fail=1
          done
          exit $fail

      - name: Sync root README into bindings/node so it ships with the npm tarball
        shell: bash
        run: cp ../../README.md README.md
        working-directory: bindings/node

      - name: Publish main package to npm (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          existing=$(npm view "wickra-copilot@$version" version 2>/dev/null)
          if [ "$existing" = "$version" ]; then
            echo "::notice::skip wickra-copilot@$version (already on npm)"
            exit 0
          fi
          npm publish --access public --ignore-scripts --provenance
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::first attempt failed (rc=$rc); retrying after 30s"
            sleep 30
            npm publish --access public --ignore-scripts --provenance
            rc=$?
          fi
          exit $rc

      - name: Pack node tarballs for release attachment
        working-directory: bindings/node
        run: |
          npm pack --ignore-scripts
          for d in npm/*/; do
            (cd "$d" && npm pack --ignore-scripts)
          done

      - name: Upload Node tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-tarballs
          path: |
            bindings/node/*.tgz
            bindings/node/npm/*/*.tgz

  # --------------------------------------------------------------------------
  # WASM: wasm-pack build + npm publish (as `wickra-copilot-wasm`)
  # --------------------------------------------------------------------------
  wasm-build:
    name: Build wickra-copilot-wasm
    needs: guard
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack (latest, via prebuilt binary)
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: wasm-pack
      - name: Build WASM package (bundler target)
        run: wasm-pack build bindings/wasm --target bundler --release
      - name: Enrich generated package.json with author + repo metadata
        working-directory: bindings/wasm/pkg
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.author = 'kingchenc <support@wickra.org>';
            pkg.repository = { type: 'git', url: 'https://github.com/wickra-lib/wickra-copilot' };
            pkg.homepage = 'https://github.com/wickra-lib/wickra-copilot';
            pkg.bugs = { url: 'https://github.com/wickra-lib/wickra-copilot/issues' };
            pkg.license = 'MIT OR Apache-2.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - name: Pack wickra-copilot-wasm for release attachment
        working-directory: bindings/wasm/pkg
        run: npm pack
      - name: Upload WASM tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-tarball
          path: bindings/wasm/pkg/wickra-copilot-wasm-*.tgz

  wasm-publish:
    name: Publish wickra-copilot-wasm to npm
    needs: [gate, wasm-build]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore provenance from the GitHub OIDC token
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Download the packed tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-tarball
          path: wasm-pkg
      - name: Publish wickra-copilot-wasm to npm (idempotent)
        run: |
          set -euo pipefail
          tarball=$(find wasm-pkg -name 'wickra-copilot-wasm-*.tgz' | head -1)
          if [ -z "$tarball" ]; then
            echo "::error::wasm-build produced no tarball"
            exit 1
          fi
          # "./" is load-bearing: npm reads a bare `dir/file.tgz` as the
          # `owner/repo` GitHub shorthand and tries to clone it rather than
          # reading the file, dying on `git ls-remote` before it ever reaches
          # the registry.
          if out=$(npm publish "./$tarball" --access public --provenance 2>&1); then
            echo "$out"
          elif printf '%s' "$out" | grep -q "You cannot publish over"; then
            echo "skip: version already on npm"
          else
            echo "$out"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --------------------------------------------------------------------------
  # CLI binaries: build the wickra-copilot executable per platform on a native
  # runner and attach it to the GitHub Release (in addition to `cargo install`).
  # --------------------------------------------------------------------------
  cli-binaries:
    name: CLI binary (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the CLI binary
        run: cargo build -p wickra-copilot --release --target ${{ matrix.target }}
      - name: Package the binary
        shell: bash
        run: |
          set -e
          dir="wickra-copilot-${{ matrix.target }}"
          mkdir -p "$dir"
          bin="target/${{ matrix.target }}/release/wickra-copilot"
          if [ -f "$bin.exe" ]; then
            cp "$bin.exe" "$dir/"
          else
            cp "$bin" "$dir/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: wickra-copilot-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # C ABI native libraries (bindings/c) — built per target, attached to the
  # GitHub Release and consumed by the C#, Java and Go publish jobs.
  # --------------------------------------------------------------------------
  c-abi-build:
    name: C ABI library (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-copilot-c --release --target ${{ matrix.target }}
      - name: Package header + libraries
        shell: bash
        run: |
          set -e
          dir="wickra-copilot-c-${{ matrix.target }}"
          mkdir -p "$dir/include" "$dir/lib"
          cp bindings/c/include/wickra_copilot.h bindings/c/include/wickra_copilot.hpp "$dir/include/"
          for f in libwickra_copilot.so libwickra_copilot.a libwickra_copilot.dylib wickra_copilot.dll wickra_copilot.dll.lib wickra_copilot.lib; do
            src="target/${{ matrix.target }}/release/$f"
            [ -f "$src" ] && cp "$src" "$dir/lib/"
          done
          tar -czf "$dir.tar.gz" "$dir"
          echo "packaged $dir:"; ls -lR "$dir"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c-abi-${{ matrix.target }}
          path: wickra-copilot-c-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Pack and publish the .NET binding to NuGet. Authentication uses NuGet Trusted
  # Publishing (OIDC) — no long-lived API key. Configure the trusted-publishing
  # policy on nuget.org (owner KingchenC, repo wickra-lib/wickra-copilot,
  # workflow release.yml) for the Wickra.Copilot package.
  csharp-publish:
    name: Publish to NuGet
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Stage native libraries into runtimes/<rid>/native
        shell: bash
        run: |
          set -e
          declare -A RID=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/csharp/WickraCopilot/runtimes
          for target in "${!RID[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-copilot-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${RID[$target]}/native"; mkdir -p "$dest"
            for f in libwickra_copilot.so libwickra_copilot.dylib wickra_copilot.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${RID[$target]}:"; ls -l "$dest"
          done
      - name: Pack
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 20
          shell: bash
          command: |
            version="${GITHUB_REF_NAME#v}"
            dotnet pack bindings/csharp/WickraCopilot/WickraCopilot.csproj -c Release -p:Version="$version" -o nupkg
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget_login
        with:
          user: KingchenC
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Upload the NuGet package as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: nupkg/*.nupkg
          if-no-files-found: error

  # Publish the Java binding to Maven Central. The org.wickra namespace is
  # verified; auth uses the Sonatype Central token (CENTRAL_USERNAME /
  # CENTRAL_PASSWORD) and artifacts are GPG-signed (GPG_PRIVATE_KEY /
  # GPG_PASSPHRASE). The pom version must match the release tag.
  java-publish:
    name: Publish to Maven Central
    # Central validates in minutes and publishes when it gets to it; the
    # v0.1.0 deployment was accepted and then took longer than the plugin's
    # default 30-minute wait to publish, which failed the job while the
    # artifact went live anyway. The pom waits up to two hours; this allows it.
    timeout-minutes: 150
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Stage native libraries into resources/native/<os>-<arch>
        shell: bash
        run: |
          set -e
          declare -A PLAT=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/java/src/main/resources/native
          for target in "${!PLAT[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-copilot-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${PLAT[$target]}"; mkdir -p "$dest"
            for f in libwickra_copilot.so libwickra_copilot.dylib wickra_copilot.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${PLAT[$target]}:"; ls -l "$dest"
          done
      - name: Set up JDK 25 + Maven Central credentials + GPG
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      # Idempotent, like the npm and PyPI steps: a version that is already on
      # the repository is not deployed again. Central refuses a second
      # deployment of the same version, so without this check a re-run of a
      # release whose Maven step timed out -- while Central went on to publish
      # the bundle it had accepted -- fails a second time on a duplicate, and
      # the jobs behind it (assets, provenance, the GitHub Release) never run.
      - name: Skip the deploy when this version is already on Maven Central
        id: central
        shell: bash
        run: |
          version=$(mvn -B -q -f bindings/java help:evaluate -Dexpression=project.version -DforceStdout)
          url="https://repo1.maven.org/maven2/org/wickra/wickra-copilot/${version}/wickra-copilot-${version}.pom"
          if curl -sSf -o /dev/null "$url"; then
            echo "skip: org.wickra:wickra-copilot:${version} is already on Maven Central"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "org.wickra:wickra-copilot:${version} is not on Maven Central yet"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Maven Central
        if: steps.central.outputs.published != 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -f bindings/java -Prelease deploy -DskipTests
      # The jar the attestation job signs has to exist whether or not this run
      # deployed it.
      - name: Build the jar when the deploy was skipped
        if: steps.central.outputs.published == 'true'
        run: mvn -B -f bindings/java package -DskipTests

      # The jar is what a Java consumer installs. Maven Central resolves it on
      # demand, so it does not belong on the release page -- but it does have to
      # exist as an artifact, or the attestation job has nothing to sign.
      - name: Upload the Java jar as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-jar
          path: |
            bindings/java/target/*.jar
            !bindings/java/target/*-sources.jar
            !bindings/java/target/*-javadoc.jar
          if-no-files-found: error
  # Mirror the in-repo Go module to the standalone wickra-copilot-go repository so
  # `go get github.com/wickra-lib/wickra-copilot-go` builds with no extra steps.
  # The mirror commits the prebuilt libraries per platform under
  # lib/<goos>_<goarch>/ alongside the vendored header. The push uses a
  # fine-grained PAT (GO_MIRROR_TOKEN, contents:write on
  # wickra-copilot-go); the mirror's bot commit is intentionally unsigned.
  go-mirror:
    name: Mirror the Go module to wickra-copilot-go
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Assemble the wickra-copilot-go module tree
        shell: bash
        run: |
          set -e
          out=wickra-copilot-go-module
          mkdir -p "$out/include" "$out/lib"
          # Sources only. The test files stay behind: they locate golden/ by
          # walking up from the working directory, and the published module has
          # no repository above it -- a consumer running `go test ./...` on the
          # module gets a suite that can never find its fixtures.
          for f in bindings/go/*.go; do
            case "$f" in *_test.go) continue ;; esac
            cp "$f" "$out/"
          done
          cp bindings/go/include/wickra_copilot.h "$out/include/"
          cp bindings/go/README.md "$out/"
          cp LICENSE-MIT LICENSE-APACHE "$out/"
          # The in-repo go.mod already declares the standalone module path.
          cp bindings/go/go.mod "$out/go.mod"
          declare -A GO=(
            [x86_64-unknown-linux-gnu]="linux_amd64 libwickra_copilot.so"
            [aarch64-unknown-linux-gnu]="linux_arm64 libwickra_copilot.so"
            [x86_64-apple-darwin]="darwin_amd64 libwickra_copilot.dylib"
            [aarch64-apple-darwin]="darwin_arm64 libwickra_copilot.dylib"
            [x86_64-pc-windows-msvc]="windows_amd64 wickra_copilot.dll"
            [aarch64-pc-windows-msvc]="windows_arm64 wickra_copilot.dll"
          )
          for target in "${!GO[@]}"; do
            read -r dir libfile <<< "${GO[$target]}"
            archive=$(find c-abi-artifacts -name "wickra-copilot-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            src=$(find "$tmp" -name "$libfile" | head -1)
            if [ -z "$src" ]; then
              echo "::error::missing $libfile for $target"; exit 1
            fi
            mkdir -p "$out/lib/$dir"; cp "$src" "$out/lib/$dir/"
          done
          echo "assembled module:"; find "$out" -type f | sort
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # The module was assembled and pushed without ever being compiled. cgo
      # directives, the vendored header and the staged library are exactly the
      # things that break silently in assembly, and the first person to find out
      # would be whoever ran `go get`. Compiling proves the header and the cgo
      # directives; running proves the library is actually loadable.
      - name: Verify the assembled module builds and runs
        shell: bash
        run: |
          set -euo pipefail
          cd wickra-copilot-go-module
          cat > smoke_main_test.go <<'GO'
          package wickra

          import (
            "strings"
            "testing"
          )

          func TestAssembledModuleSmoke(t *testing.T) {
            if Version() == "" {
              t.Fatal("Version() returned an empty string")
            }
            h := New()
            defer h.Close()
            out, err := h.Command(`{"cmd":"version"}`)
            if err != nil {
              t.Fatalf("Command: %v", err)
            }
            if !strings.Contains(out, "version") {
              t.Fatalf("unexpected response: %s", out)
            }
          }
          GO
          go vet ./...
          go test -run TestAssembledModuleSmoke -v ./...
          rm smoke_main_test.go
          echo "module builds, links and runs"

      - name: Push to wickra-copilot-go and tag the release
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.GO_MIRROR_TOKEN }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/wickra-lib/wickra-copilot-go.git"
          git clone -q "$remote" mirror-repo
          cd mirror-repo
          git config user.name "wickra-bot"
          git config user.email "support@wickra.org"
          git symbolic-ref HEAD refs/heads/main
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r ../wickra-copilot-go-module/. .
          git add -A
          if git diff --cached --quiet; then
            echo "wickra-copilot-go already up to date; tagging only"
          else
            git -c commit.gpgsign=false commit -q -m "Release v$version"
          fi
          git push origin HEAD:refs/heads/main
          git tag "v$version"
          git push origin "v$version"

  # --------------------------------------------------------------------------
  # GitHub Release: create a DRAFT, attach every built artefact, then publish-
  # release flips it to published (immutability-ready ordering).
  # --------------------------------------------------------------------------
  github-release:
    name: Attach assets to the draft GitHub Release
    timeout-minutes: 45
    needs: [cargo-publish, python-publish, node-publish, wasm-publish, cli-binaries, c-abi-build, csharp-publish, java-publish, go-mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve target tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::no v* tag found to attach assets to"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::attaching assets to release $tag"
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          set -e
          mkdir -p release-assets
          find artifacts -type f -name "*.whl" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.node" -exec cp {} release-assets/ \;
          find artifacts -type f -name "wickra-copilot-*.tgz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.crate" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.cdx.json" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.nupkg" -exec cp {} release-assets/ \;
          ls -lh release-assets/
          echo "asset-count=$(find release-assets/ -type f | wc -l)"
      - name: Create / update the draft GitHub Release with assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: wickra-copilot ${{ steps.tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: true
          body: |
            wickra-copilot ${{ github.ref_name }} — a local market copilot: a deterministic grounding core (`wickra-copilot-core`) that folds serialized microstructure feeds (order book, trades, funding, open interest, liquidations) into a byte-identical `MarketContext` of hard facts (price moves, order-book imbalance, liquidation clusters, funding flips, OI changes, volatility spikes), exposed as a JSON-over-C-ABI data API in ten languages — native Rust, Python, Node.js, WASM plus a C ABI hub for C, C++, C#, Go, Java, R — with a CLI. A separate, swappable adapter (`wickra-copilot-llm`) renders that context into a prompt and calls the user's own LLM endpoint; the LLM call is never part of the deterministic core.

            ### Install

            ```bash
            cargo install wickra-copilot
            pip install wickra-copilot
            npm install wickra-copilot
            dotnet add package Wickra.Copilot
            go get github.com/wickra-lib/wickra-copilot-go
            ```

            Java (Maven Central):

            ```xml
            <dependency>
              <groupId>org.wickra</groupId>
              <artifactId>wickra-copilot</artifactId>
              <version>${{ steps.tag.outputs.version }}</version>
            </dependency>
            ```

            R (r-universe):

            ```r
            install.packages("wickracopilot", repos = "https://wickra-lib.r-universe.dev")
            ```

            ### Attached assets

            Pre-built artefacts for every supported platform — the same files this
            workflow run published to crates.io, PyPI, and npm — plus standalone
            CLI binaries and the C ABI libraries. C# ships to NuGet, Java to Maven
            Central, Go to the wickra-copilot-go module, and R to r-universe via
            their own release jobs.

            ### Auto-generated changelog

            See below; GitHub computes it from the commits since the previous tag.

  # --------------------------------------------------------------------------
  # Build provenance attestations
  # --------------------------------------------------------------------------
  attestations:
    name: Attest build provenance
    timeout-minutes: 45
    needs: [cargo-publish, python-wheels, python-sdist, github-release, c-abi-build, csharp-publish, java-publish]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download crate files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-files
          path: artifacts/crates
      - name: Download wheels + sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: artifacts/python
          merge-multiple: true
      - name: Download the C ABI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: artifacts/c-abi
          merge-multiple: true
      - name: Download the NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts/nuget
      - name: Download the Java jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-jar
          path: artifacts/java
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/c-abi/*.tar.gz
            artifacts/nuget/*.nupkg
            artifacts/java/*.jar
            artifacts/crates/*.crate
            artifacts/python/*.whl
            artifacts/python/*.tar.gz
      - name: Attach provenance bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot attach provenance."
            exit 1
          fi
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "::error::attestation bundle not found at '$BUNDLE'."
            exit 1
          fi
          dest="wickra-copilot-${TAG}.provenance.intoto.jsonl"
          cp "$BUNDLE" "$dest"
          echo "Uploading $dest to release $TAG"
          gh release upload "$TAG" "$dest" --clobber --repo "${{ github.repository }}"

  # --------------------------------------------------------------------------
  # Publish the drafted release LAST (immutability-ready).
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish the GitHub Release
    timeout-minutes: 45
    needs: [github-release, attestations]
    if: always() && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flip the draft release to published (latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot publish."
            exit 1
          fi
          echo "::notice::publishing release $TAG (draft -> published, latest)"
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
